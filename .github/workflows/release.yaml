---
name: Release

on:
  schedule:
    # Run on the 1st of every month at midnight UTC
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

# Top-level default is read-only; the release job below opts up to the
# write scopes it needs (CKV2_GHA_1, zizmor excessive-permissions).
permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # persist-credentials is deliberately NOT set to false here: the
        # "Update VERSION file" step below pushes the bump branch, which needs
        # the credential helper the checkout leaves behind. This is the
        # documented exception to the house artipacked default.
        #
        # ref is pinned to main so a workflow_dispatch run started against a
        # stray branch/tag selection in the Actions UI can't have its commits
        # squash-merged into main disguised as a VERSION bump: without this,
        # checkout defaults to whatever ref was picked in the "Run workflow"
        # dropdown, and the self-merge below (0 required approvals) would
        # never give a human the chance to notice.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: main
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: next
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Bumping from ${CURRENT} to ${NEXT} (${BUMP})"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: |
          if gh release view "v${NEXT_VERSION}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${NEXT_VERSION} already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update VERSION file
        # main is protected by baseline-main-protection (PR required, 0
        # approvals), and GitHub refuses the Actions app as a bypass actor on
        # personal-account rulesets — so the bump rides a PR the job merges
        # itself. Needs the repo's "Allow GitHub Actions to create and approve
        # pull requests" setting on (enabled 2026-08-01).
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: |
          BRANCH="release/bump-v${NEXT_VERSION}"
          echo "${NEXT_VERSION}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VERSION
          git commit -m "chore: bump version to ${NEXT_VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump version to ${NEXT_VERSION}" \
            --body "Automated VERSION bump for the v${NEXT_VERSION} release."

          # Mergeability can lag a moment after PR creation; retry briefly.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              exit 0
            fi
            echo "Merge attempt ${attempt} failed, retrying in 10s"
            sleep 10
          done
          echo "Failed to merge VERSION bump PR" >&2
          exit 1

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: |
          gh release create "v${NEXT_VERSION}" \
            --title "v${NEXT_VERSION}" \
            --generate-notes
