---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app acinfinity-fan-sync
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      acinfinity-fan-sync:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lukeevanstech/acinfinity-exporter
              tag: 1.1.0  # Update this when you build the new image
            # Override entrypoint to run fan sync instead of exporter
            command:
              - python
              - -m
              - src.fan_sync
            env:
              TZ: ${TIMEZONE:=UTC}
              LOG_LEVEL: INFO
              # Sync interval in seconds (how often to check/sync speeds)
              SYNC_INTERVAL: "60"
              # Intake will run at this percentage of exhaust speed (0.85 = 85%)
              INTAKE_RATIO: "0.85"
              # Controller names as shown in AC Infinity app
              # TODO: Update these to match your actual controller names
              EXHAUST_CONTROLLER: "Garage Main Rack"
              EXHAUST_PORT: "1"
              INTAKE_CONTROLLER: "Garage Comms Rack"
              INTAKE_PORT: "1"
            envFrom:
              - secretRef:
                  name: acinfinity-fan-sync-secret
            probes:
              # No HTTP probes since this is a sync service, not a web server
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    # No service needed - this is a sync service, not exposing any ports
    service:
      app:
        enabled: false
